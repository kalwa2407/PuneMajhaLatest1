<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Deep Navy Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1128"/>
      <stop offset="50%" stop-color="#141e48"/>
      <stop offset="100%" stop-color="#090e22"/>
    </linearGradient>

    <!-- Pune Majha Crimson & Navy Accent Flare -->
    <radialGradient id="redGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ec2027" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#8b1e24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="navyGlow" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#222c6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#redGlow)"/>
  <rect width="800" height="450" fill="url(#navyGlow)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Subtle Ambient Corner Accents -->
  <path d="M 0 0 L 120 0 L 0 120 Z" fill="rgba(236, 32, 39, 0.16)"/>
  <path d="M 800 450 L 680 450 L 800 330 Z" fill="rgba(34, 44, 110, 0.28)"/>

  <!-- Center News Broadcast Emblem -->
  <g transform="translate(400, 200)">
    <circle r="52" fill="none" stroke="rgba(236, 32, 39, 0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="42" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

    <!-- Camera / Broadcast Signal Icon -->
    <path d="M -18 -10 L 8 -10 C 11 -10 13 -8 13 -5 L 13 13 C 13 16 11 18 8 18 L -18 18 C -21 18 -23 16 -23 13 L -23 -5 C -23 -8 -21 -10 -18 -10 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-5" cy="4" r="6" fill="none" stroke="#ec2027" stroke-width="2.2"/>
    <path d="M 13 -2 L 23 -8 L 23 16 L 13 10 Z" fill="#ec2027" opacity="0.95"/>

    <!-- Live Beacon Dot -->
    <circle cx="-16" cy="-4" r="2.5" fill="#22c55e"/>
  </g>

  <!-- Pune Majha News Brand Pill -->
  <g transform="translate(400, 282)">
    <rect x="-105" y="-15" width="210" height="30" rx="15" fill="#ec2027" filter="drop-shadow(0 4px 12px rgba(236,32,39,0.4))"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="2.2" text-anchor="middle">PUNE MAJHA NEWS</text>
  </g>

  <!-- Tagline / News Bulletin Subtitle -->
  <text x="400" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.78)" letter-spacing="1" text-anchor="middle">PUNE &amp; MAHARASHTRA • 24X7 BREAKING BULLETIN</text>
  <text x="400" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.42)" letter-spacing="0.5" text-anchor="middle">आवाज आपल्या हक्काचा!</text>
</svg>
